name: scanmem_tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  REFERENCE_SCANMEM_DIR: "reference_scanmem"
  TEST_SCANMEM_DIR: "test_scanmem"
  REFERENCE_SCANMEM_REPO: "https://github.com/scanmem/scanmem.git"
  REFERENCE_SCANMEM_COMMIT: "0375cc02b132c1678fcbeabdfee4cd81d353358f"
  TEST_SCANMEM_REPO: "https://github.com/sivertac/scanmem.git"
  TEST_SCANMEM_COMMIT: "285899d82cf10d36f179eb8ed16e4f4cb69cfc5b"
  
jobs:
  build_scanmem_tests:
    runs-on: ubuntu-24.04
    steps:
    
    - name: Install scanmem dependencies
      run: sudo apt-get install -y autotools-dev libtool libreadline-dev intltool
    
    - uses: actions/checkout@v4
    - name: Build scanmem-tests
      run: cargo build --verbose
    
    - name: Checkout reference scanmem
      run: mkdir $REFERENCE_SCANMEM_DIR && pushd $REFERENCE_SCANMEM_DIR && git init && git remote add origin $REFERENCE_SCANMEM_REPO && git fetch --depth 1 origin $REFERENCE_SCANMEM_COMMIT && git checkout FETCH_HEAD && popd
    - name: Configure reference scanmem
      run: pushd $REFERENCE_SCANMEM_DIR && ./autogen.sh && ./configure && popd
    - name: Build reference scanmem
      run: pushd $REFERENCE_SCANMEM_DIR && make -j $(nproc) && popd

    - name: Checkout test scanmem
      run: mkdir $TEST_SCANMEM_DIR && pushd $TEST_SCANMEM_DIR && git init && git remote add origin $TEST_SCANMEM_REPO && git fetch --depth 1 origin $TEST_SCANMEM_COMMIT && git checkout FETCH_HEAD && popd
    - name: Configure test scanmem
      run: pushd $TEST_SCANMEM_DIR && ./autogen.sh && ./configure && popd
    - name: Build test scanmem
      run: pushd $TEST_SCANMEM_DIR && make -j $(nproc) && popd

    - name: Create artifact archive
      run: tar -czvf scanmem-tests-build-artifact.tar.gz $GITHUB_WORKSPACE
      working-directory: /work/scanmem-tests
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: scanmem-tests-build-artifact
        path: scanmem-tests-build-artifact.tar.gz
        working-directory: /work/scanmem-tests

  run_conformance_suite:
    runs-on: ubuntu-24.04
    needs: [build_scanmem_tests]
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: scanmem-tests-build-artifact
    - name: Extract artifact archive
      run: tar -xzvf ../scanmem-tests-build-artifact.tar.gz
    #- name: Change permissions
    #  run: chmod 755 ./target/debug/conformance && chmod 755 ./target/debug/synthetic_load && chmod 755 ./target/debug/benchmark && chmod 755 $REFERENCE_SCANMEM_DIR/scanmem && chmod 755 $TEST_SCANMEM_DIR/scanmem
    - name: LS
      run: sudo ls -lh ./target/debug
    - name: Test
      run: sudo ./target/debug/conformance --reference-scanmem-program $REFERENCE_SCANMEM_DIR/scanmem --test-scanmem-program $TEST_SCANMEM_DIR/scanmem --test Operators.0 -v --ctrf-output report.ctrf.json
    - name: Publish test report
      uses: ctrf-io/github-test-reporter@v1
      with:
        report-path: report.ctrf.json
        github-report: true
  
  
